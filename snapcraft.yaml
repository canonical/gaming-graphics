name: gaming-graphics-core24
adopt-info: debs
summary: Shared Mesa stack for gaming
description: |
 This snap includes newer versions of Mesa optimized for gaming.
confinement: strict
grade: stable
base: core26
platforms:
  amd64:
compression: lzo

slots:
  gaming-graphics-core24:
    interface: content
    read:
      - /

lint:
  ignore:
    - library:
        - lib/i386-linux-gnu/**
        - usr/lib/i386-linux-gnu/**
        - lib32/**
        - usr/lib32/**

package-repositories:
  - type: apt
    url: http://archive.ubuntu.com/ubuntu/
    suites: [resolute, resolute-updates]
    components: [main, universe]
    architectures: [amd64, i386]
    key-id: F6ECB3762474EDA9D21B7022871920D1991BC93C
    key-server: keyserver.ubuntu.com
  - type: apt
    # FIXME: We need to enable both 32-bit and 64-bit architectures
    # for this PPA, but Snapcraft doesn't let us do that with the
    # short syntax. So use the full version instead.

    # ppa: oibaf/graphics-drivers
    url: http://ppa.launchpad.net/oibaf/graphics-drivers/ubuntu
    suites: [resolute]
    components: [main]
    architectures: [amd64, i386]
    key-id: 97A37C0FB41AF4423282E5B493F4D583494746C8
    key-server: keyserver.ubuntu.com

parts:
  debs:
    plugin: nil
    build-packages:
      - patchelf
    stage-packages:
      - libdrm2:i386
      - libdrm2:amd64
      - libglx-mesa0:i386
      - libglx-mesa0:amd64
      - libgl1:i386
      - libgl1:amd64
      - libgl1-mesa-dri:i386
      - libgl1-mesa-dri:amd64
      - libvkd3d1:amd64
      - mesa-libgallium:amd64
      - mesa-libgallium:i386
      - mesa-vulkan-drivers:amd64
      - mesa-vulkan-drivers:i386
      - va-driver-all:amd64
      - va-driver-all:i386
      - libvdpau-va-gl1:amd64
      - libdrm-common
      - vulkan-tools # For testing/debugging
      - mesa-utils # For testing/debugging
      - libxml2-16:i386
      - libxml2-16:amd64
      - libstdc++6
    stage:
      - -usr/share/doc
      - -usr/share/man
      - -usr/share/gcc
      - -usr/share/mesa-demos
      - -usr/share/lintian
      - -usr/share/X11
      - -usr/share/bug
      - -usr/share/locale
      - -usr/share/gdb
      - -etc/X11
      - -etc/sensors3.conf
      - -usr/lib/*/gconv
    override-prime: |
      craftctl default
      # Set the snap version from the mesa package version
      craftctl set version=$(dpkg-parsechangelog -l $CRAFT_PART_INSTALL/usr/share/doc/mesa-libgallium/changelog*gz -S Version | cut -c -32)
      # Clear execstack
      for f in usr/lib/*/libvkd3d-shader.so.* usr/lib/*/libvkd3d.so.*; do
        if [ -f $f ]; then
          patchelf --clear-execstack $f
        fi
      done
