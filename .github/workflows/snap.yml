name: snap-build
on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches:
      - '*-core[0-9]*'
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: snapcore/action-build@v1
      id: snapcraft
    - uses: actions/upload-artifact@v4
      with:
        name: 'snap-${{ github.base_ref || github.ref_name }}'
        path: ${{ steps.snapcraft.outputs.snap }}
        if-no-files-found: error
